# lib/rust-gate.node.yml — canonical Rust gate fragment.
#
# The standard lane for plain Rust checkouts: fmt --check →
# clippy -D warnings → test --workspace → doc --no-deps. Repos with
# heavier or different gates compose their own gate.yaml legs
# (see gates/ and the dual-lane examples) — ci.sh is retired.
#
# Runs in the dev checkout (campaigns are host-side; worktree
# sibling plumbing is ci.sh/bupha's job, not ours).
#
# Parent owns the event contract — declare `on:`/`emits:` and
# `params.emit` at the include site; override `params.repo`,
# `params.results`, `params.family`, `params.timeout`,
# `params.extra`, `params.env_file` as needed. When `params.results` is set, every
# run appends {"family","repo","rc","secs"} to that JSONL file
# (skipped family-guard exits record nothing).
#
#   - include: ../lib/rust-gate.node.yml
#     id: verify.rust
#     on: [verify.due]
#     emits: [verify.rust.done, verify.rust.failed]
#     params:
#       repo: "${config.verify.repo}"
#       results: "${config.verify.results_dir}/results.jsonl"
#       emit: {"0": verify.rust.done, default: verify.rust.failed}
#
# params.env_file — shell env file sourced before the cargo legs
# (ensure-siblings.node.yml drops CARGO_TARGET_DIR there so worktree
# runs share one warm target dir). "auto" (default) =
# `$(dirname <repo>)/.gate-env/<checkout>.env`; a literal path
# overrides; "" skips sourcing.
#
id: gate.rust
driver: shell
params:
  repo: ""
  # When set, the node no-ops (exit 0) unless it equals "rust" — lets
  # one campaign include all three family fragments and run only the
  # selected lane. Empty = always run.
  family: ""
  # JSONL results file — appended on every real run (pass or fail).
  results: ""
  # Extra cargo args appended to the test leg (e.g. "-p mycrate").
  extra: ""
  env_file: "auto"
  timeout: 3600
  # Literal block (|), NOT folded (>): the shell comments below must
  # stay on their own lines — under >- folding they would join the
  # script into one line and `#` would comment out the rest of it.
  cmd: |
    set -uo pipefail;
    F="${params.family}"; [ -z "$F" ] || [ "$F" = "rust" ] || { echo "family=$F — skipped"; exit 0; };
    REPO="${params.repo}";
    RESULTS="${params.results}";
    START=$(date +%s);
    cd "$REPO" &&
    REPO="$(pwd)" &&
    { EF="${params.env_file}"; [ "$EF" = "auto" ] && EF="$(dirname "$REPO")/.gate-env/$(basename "$REPO").env"; [ -z "$EF" ] || [ ! -f "$EF" ] || . "$EF"; } &&
    export PATH="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin" CARGO_INCREMENTAL=0 &&
    # fmt is scoped to workspace members: `cargo fmt --all` also
    # formats path dependencies (siblings via ../ or path =), so a
    # drifting sibling repo would fail THIS repo's gate — and plain
    # `cargo fmt` would rewrite the sibling's real files through
    # worktree symlinks. Member list comes from cargo metadata.
    MEMBERS=$(cargo metadata --no-deps --format-version 1 2>/dev/null | jq -r '.workspace_members as $m | .packages[] | select(.id as $id | $m | index($id)) | .name' 2>/dev/null) &&
    if [ -n "$MEMBERS" ]; then
      FMT_PKGS=""; for p in $MEMBERS; do FMT_PKGS="$FMT_PKGS -p $p"; done;
      cargo fmt $FMT_PKGS -- --check;
    else
      cargo fmt --all -- --check;
    fi &&
    cargo clippy --workspace --all-targets -- -D warnings &&
    cargo test --workspace ${params.extra} &&
    cargo doc --workspace --no-deps;
    rc=$?;
    if [ -n "$RESULTS" ]; then
      esc=$(printf '%s' "$REPO" | sed 's/\\/\\\\/g; s/"/\\"/g');
      printf '{"family":"rust","repo":"%s","rc":%s,"secs":%s}\n' "$esc" "$rc" "$(( $(date +%s) - START ))" >> "$RESULTS" 2>/dev/null || true;
    fi;
    exit $rc
  emit:
    "0": gate.done
    default: gate.failed
