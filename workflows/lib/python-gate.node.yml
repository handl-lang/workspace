# lib/python-gate.node.yml — canonical Python gate fragment.
#
# The baseline uv lane: `uv sync --group dev` (falls back to bare
# sync) → ruff check → ruff format --check → pytest when a
# tests dir/testpaths exist. Repos with heavier gates (coverage
# floors, import-linter, ty, vulture) compose their own gate.yaml
# legs — ci.sh is retired; this fragment is the *standard lane*.
#
# Parent owns the event contract — declare `on:`/`emits:` and
# `params.emit` at the include site; override `params.repo`,
# `params.results`, `params.family`, `params.timeout`,
# `params.pytest_args`, `params.env_file` as needed. When
# `params.results` is set,
# every run appends {"family","repo","rc","secs"} to that JSONL
# file (skipped family-guard exits record nothing).
#
#   - include: ../lib/python-gate.node.yml
#     id: verify.py
#     on: [verify.due]
#     emits: [verify.py.done, verify.py.failed]
#     params:
#       repo: "${config.verify.repo}"
#       results: "${config.verify.results_dir}/results.jsonl"
#       emit: {"0": verify.py.done, default: verify.py.failed}
#
id: gate.python
driver: shell
params:
  repo: ""
  # Family guard — see rust-gate.node.yml; match is "python".
  family: ""
  # JSONL results file — appended on every real run (pass or fail).
  results: ""
  pytest_args: "-q"
  env_file: "auto"
  timeout: 3600
  cmd: >-
    set -uo pipefail;
    F="${params.family}"; [ -z "$F" ] || [ "$F" = "python" ] || { echo "family=$F — skipped"; exit 0; };
    REPO="${params.repo}";
    RESULTS="${params.results}";
    START=$(date +%s);
    cd "$REPO" &&
    REPO="$(pwd)" &&
    { EF="${params.env_file}"; [ "$EF" = "auto" ] && EF="$(dirname "$REPO")/.gate-env/$(basename "$REPO").env"; [ -z "$EF" ] || [ ! -f "$EF" ] || . "$EF"; } &&
    export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin" &&
    { uv sync --group dev 2>/dev/null || uv sync; } &&
    { RUFF=""; [ -x .venv/bin/ruff ] && RUFF=".venv/bin/ruff"; [ -z "$RUFF" ] && command -v ruff >/dev/null 2>&1 && RUFF=ruff;
      if [ -n "$RUFF" ]; then "$RUFF" check . && "$RUFF" format --check .; else echo "ruff not installed — lint legs skipped"; fi; } &&
    { if [ -d tests ] || [ -d test ] || grep -q 'testpaths' pyproject.toml 2>/dev/null; then .venv/bin/python -m pytest ${params.pytest_args}; else echo "no tests dir — pytest leg skipped"; fi; };
    rc=$?;
    if [ -n "$RESULTS" ]; then
      esc=$(printf '%s' "$REPO" | sed 's/\\/\\\\/g; s/"/\\"/g');
      printf '{"family":"python","repo":"%s","rc":%s,"secs":%s}\n' "$esc" "$rc" "$(( $(date +%s) - START ))" >> "$RESULTS" 2>/dev/null || true;
    fi;
    exit $rc
  emit:
    "0": gate.done
    default: gate.failed
