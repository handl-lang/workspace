# handl-gates — per-family gate fragments + one-shot gate campaigns
# as a tamias-installable peregrin bundle.
#
# `tamias install ./workflows` (or a git ref pointing at this dir)
# fetches the whole payload: lib/ (reusable *.node.yml fragments),
# gates/ (one-shot per-family campaigns), and the fleet campaigns
# (repo-verify/, handl-verify/, mlopt-nightly/).
#
# This is the distribution half of the ci.sh retirement: each repo
# drops a thin committed workflows/gate.yaml that includes the
# family campaign via `tamias:handl-gates@<ver>//gates/<family>.yaml`,
# and bupha runs `peregrin campaign run workflows/gate.yaml` per
# push. gates/*.yaml are the same composition pre-packaged for
# ad-hoc/installed-bundle use (`campaign submit --bundle
# handl-gates --workflow gates/<family>.yaml`).
#
# NOTE: this manifest sits at the workflows/ root, so the whole
# directory is ONE bundle payload. The per-campaign tamias.yaml
# files inside repo-verify/, handl-verify/, mlopt-nightly/ remain
# for standalone installs during the transition; under handl-gates
# they are inert payload files.
name: handl-gates
version: "0.3.5"
# `peregrin-bundle` routes install/deploy/uninstall through
# `tamias-driver-peregrin` (capabilities: types ["peregrin-bundle"]).
type: peregrin-bundle
description: >-
  Canonical ensure-siblings/rust/python/handl gate fragments (lib/)
  plus one-shot
  per-family gate campaigns (gates/) and the fleet verify campaigns.
  No git/forge calls — gates run the target repo's own gate recipe
  (committed ci.sh when present, else the family baseline) in its
  checkout. On-demand only: `campaign run`/`submit`, no schedule,
  no ingress.

provider:
  # SHARED provider identity — identical to every other
  # peregrin-bundle so all campaign services render ONE
  # peregrin-campaign.service. Keep `exec` identical — last deploy
  # wins the unit file.
  name: peregrin
  services:
    - name: campaign
      exec: >-
        ~/.local/bin/peregrin campaign serve ~/.config/peregrin/serve
        --listen 127.0.0.1:29173 --path /hook
        --history-dir ~/.local/share/peregrin/serve-history
        --queue-store-dir ~/.local/share/peregrin/serve-queues
      env_file: "~/.config/peregrin/env"
      workdir: "~"
      restart: on-failure
  # No ingress: `campaign run`/`submit` only — nothing listens for
  # forge webhooks. No schedule either — every workflow here is
  # on-demand (handl-verify/mlopt-nightly carry their own schedule
  # nodes inside their campaign files).
  verbs: [run, logs]
