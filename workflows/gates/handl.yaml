# gates/handl.yaml — one-shot Handl family gate for ONE repo
# checkout.
#
# What it does: gate.init validates the repo config and truncates
# the results file → gate.ensure restores the worktree sibling
# layout and drops the shared CARGO_TARGET_DIR env file (no-op in a
# main checkout) → the lib/handl-gate.node.yml fragment resolves
# the hnl toolchain and runs the repo's own gate (`bash ci.sh` when
# present, else `hnl typecheck/lint/test` over handl-packages/src)
# in the checkout → gate.report reads the results.jsonl record and
# emits the terminal verdict: gate.pass / gate.fail. The campaign's
# `result:` block maps those events to run conclusions
# (success/failure) for `campaign run --result`.
#
# On demand only — `on: [start]`, no schedule, no ingress:
#
#   # from this checkout:
#   GATE_REPO=$HOME/GitHub/handl-lang/lib-command \
#     ~/.local/bin/peregrin campaign run gates/handl.yaml --history run.jsonl
#
#   # `campaign submit` can't carry GATE_* env vars server-side — pin
#   # config.gate.repo in the served yaml for submitted runs instead.
#
# Node failure does not affect the process exit code — the verdict
# is the gate.pass/gate.fail event in the run's event log
# (--history JSONL / `peregrin runs`/`log`).
name: gate-handl

# Operator-facing knobs — every ${config.gate.*} lookup below carries
# an env() fallback, so `campaign run` reads GATE_* env vars (see
# capabilities.env) and a served/rendered campaign can instead pin
# literal values under config.gate.* (config wins over env()).
# hnl/hnl_ext_dir defaults are the dogfood release build — same as
# handl-verify.
#
#   config:
#     gate:
#       repo: /abs/path/to/checkout      # required — the gate target
#       results: /path/results.jsonl     # default: ~/.local/share/handl-gates/handl.results.jsonl
#       hnl: /abs/path/hnl               # hnl binary
#       hnl_ext_dir: /abs/path           # dir holding libhnl_ext_*.so
#       src_dir: ""                      # fallback source root (handl-packages|src)
#       target_dir: auto | /abs/path | ""  # CARGO_TARGET_DIR for the env file
#       env_file: auto | /abs/path | ""    # where ensure-siblings drops it
#
result:
  - event: gate.pass
    conclusion: success
  - event: gate.fail
    conclusion: failure
  - event: gate.failed
    conclusion: failure
  - event: gate.init.failed
    conclusion: failure
  - event: ensure.failed
    conclusion: failure

capabilities:
  env:
    - GATE_REPO
    - GATE_RESULTS
    - GATE_HNL
    - GATE_HNL_EXT_DIR
    - GATE_SRC_DIR
    - GATE_TARGET_DIR
    - GATE_ENV_FILE
    - GATE_STANDARD_SPEC
    - GATE_MIMUS_BIN

nodes:
  # --- init: validate inputs, fresh results file --------------------
  - id: gate.init
    driver: shell
    on: [start]
    emits: [gate.due, gate.init.failed]
    params:
      cmd: >-
        set -u;
        REPO="${config.gate.repo:-${env("GATE_REPO","")}}";
        [ -n "$REPO" ] || { echo "gate.repo is required — set GATE_REPO or config.gate.repo to an absolute checkout path"; exit 1; };
        [ -d "$REPO" ] || { echo "no such directory: $REPO"; exit 1; };
        RES="${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/handl.results.jsonl")}}";
        mkdir -p "$(dirname "$RES")";
        : > "$RES";
        echo "gate-handl: repo=$REPO results=$RES"
      timeout: 60
      emit:
        "0": gate.due
        default: gate.init.failed

  # --- ensure: sibling layout + shared cargo target env ------------
  - include: ../lib/ensure-siblings.node.yml
    id: gate.ensure
    on: [gate.due]
    emits: [ensure.done, ensure.failed]
    params:
      repo: '${config.gate.repo:-${env("GATE_REPO","")}}'
      target_dir: '${config.gate.target_dir:-${env("GATE_TARGET_DIR","auto")}}'
      env_file: '${config.gate.env_file:-${env("GATE_ENV_FILE","auto")}}'
      emit:
        "0": ensure.done
        default: ensure.failed

  # --- gate: the canonical handl fragment ---------------------------
  - include: ../lib/handl-gate.node.yml
    id: gate.handl
    on: [ensure.done]
    emits: [gate.done, gate.failed]
    params:
      repo: '${config.gate.repo:-${env("GATE_REPO","")}}'
      results: '${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/handl.results.jsonl")}}'
      hnl: '${config.gate.hnl:-${env("GATE_HNL","$HOME/GitHub/handl-lang/.ci-target/dogfood/release/hnl")}}'
      hnl_ext_dir: '${config.gate.hnl_ext_dir:-${env("GATE_HNL_EXT_DIR","$HOME/GitHub/handl-lang/.ci-target/dogfood/release")}}'
      src_dir: '${config.gate.src_dir:-${env("GATE_SRC_DIR","")}}'
      emit:
        "0": gate.done
        default: gate.failed

  # --- standard: advisory mimus repo-conformance (never gates) -----
  - include: ../lib/mimus-standard.node.yml
    id: gate.standard
    on: [gate.done, gate.failed]
    emits: [standard.done, standard.failed]
    params:
      repo: '${config.gate.repo:-${env("GATE_REPO","")}}'
      spec: '${config.gate.standard_spec:-${env("GATE_STANDARD_SPEC","")}}'
      mimus: '${config.gate.mimus_bin:-${env("GATE_MIMUS_BIN","")}}'
      emit:
        "0": standard.done
        default: standard.failed

  # --- report: terminal verdict from the results record -------------
  - id: gate.report
    driver: shell
    on: [standard.done, standard.failed]
    emits: [gate.pass, gate.fail]
    params:
      cmd: >-
        set -u;
        F="${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/handl.results.jsonl")}}";
        [ -s "$F" ] || { echo "no results record — gate produced nothing"; exit 1; };
        line=$(tail -n 1 "$F");
        rc=$(printf '%s' "$line" | sed -n 's/.*"rc":\([0-9][0-9]*\).*/\1/p');
        echo "gate-handl verdict: $line";
        [ "${rc:-1}" = "0" ]
      timeout: 60
      emit:
        "0": gate.pass
        default: gate.fail
