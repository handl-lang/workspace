# gates/python.yaml — one-shot Python family gate for ONE repo
# checkout.
#
# What it does: gate.init validates config.gate.repo and truncates
# the results file → the lib/python-gate.node.yml fragment runs the
# canonical uv lane (uv sync → ruff check → ruff format --check →
# pytest when tests exist) in the checkout → gate.report reads the
# results.jsonl record and emits the terminal verdict:
# gate.pass / gate.fail.
#
# On demand only — `on: [start]`, no schedule, no ingress:
#
#   # from this checkout:
#   GATE_REPO=$HOME/GitHub/handl-lang/eqsat \
#     ~/.local/bin/peregrin campaign run gates/python.yaml --history run.jsonl
#
#   # from an installed bundle (tamias install ./workflows):
#   ~/.local/bin/peregrin campaign submit --bundle handl-gates \
#     --workflow gates/python.yaml
#
# Node failure does not affect the process exit code — the verdict
# is the gate.pass/gate.fail event in the run's event log
# (--history JSONL / `peregrin runs`/`log`).
name: gate-python

# Operator-facing knobs — override after `tamias deploy` in the
# rendered config, or as GATE_* env vars (env() reads them; see
# capabilities.env).
config:
  gate:
    # Absolute path to the repo checkout to gate.
    repo: '${env("GATE_REPO","")}'
    # JSONL results file — truncated at start, one
    # {"family","repo","rc","secs"} record per run.
    results: '${env("GATE_RESULTS","$HOME/.local/share/handl-gates/python.results.jsonl")}'
    # Args for the pytest leg (default "-q").
    pytest_args: '${env("GATE_PYTEST_ARGS","-q")}'

capabilities:
  env:
    - GATE_REPO
    - GATE_RESULTS
    - GATE_PYTEST_ARGS

nodes:
  # --- init: validate inputs, fresh results file --------------------
  - id: gate.init
    driver: shell
    on: [start]
    emits: [gate.due, gate.init.failed]
    params:
      cmd: >-
        set -u;
        REPO="${config.gate.repo}";
        [ -n "$REPO" ] || { echo "config.gate.repo is required (set GATE_REPO to an absolute checkout path)"; exit 1; };
        [ -d "$REPO" ] || { echo "no such directory: $REPO"; exit 1; };
        RES="${config.gate.results}";
        mkdir -p "$(dirname "$RES")";
        : > "$RES";
        echo "gate-python: repo=$REPO results=$RES"
      cwd: "~"
      timeout: 60
      emit:
        "0": gate.due
        default: gate.init.failed

  # --- gate: the canonical python fragment --------------------------
  - include: ../lib/python-gate.node.yml
    id: gate.python
    on: [gate.due]
    emits: [gate.done, gate.failed]
    params:
      repo: "${config.gate.repo}"
      results: "${config.gate.results}"
      pytest_args: "${config.gate.pytest_args}"
      emit:
        "0": gate.done
        default: gate.failed

  # --- report: terminal verdict from the results record -------------
  - id: gate.report
    driver: shell
    on: [gate.done, gate.failed]
    emits: [gate.pass, gate.fail]
    params:
      cmd: >-
        set -u;
        F="${config.gate.results}";
        [ -s "$F" ] || { echo "no results record — gate produced nothing"; exit 1; };
        line=$(tail -n 1 "$F");
        rc=$(printf '%s' "$line" | sed -n 's/.*"rc":\([0-9][0-9]*\).*/\1/p');
        echo "gate-python verdict: $line";
        [ "${rc:-1}" = "0" ]
      cwd: "~"
      timeout: 60
      emit:
        "0": gate.pass
        default: gate.fail
