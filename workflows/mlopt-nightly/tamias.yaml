# mlopt-nightly — research-mlopt's heavy lanes as a peregrin bundle.
# `tamias install <ref>` fetches this; `tamias deploy mlopt-nightly`
# renders the shared campaign service unit like every other
# peregrin-bundle (provider.name: peregrin → one
# peregrin-campaign.service hosting every bundle's config).
name: mlopt-nightly
version: "0.1.0"
# `peregrin-bundle` routes install/deploy/uninstall through
# `tamias-driver-peregrin` (capabilities: types ["peregrin-bundle"]).
type: peregrin-bundle
description: >-
  Nightly (and on-demand) heavy lanes for handl-lang/research-mlopt:
  the Python gates.sh suite lane (the part that left the per-push
  bupha cmd) plus scripts/bench.sh (the retired bench.yml ladder).
  Both run in the dev checkout; results land under the results dir.

provider:
  # SHARED provider identity (T8-7) — identical to ci-gate/docs-deploy/
  # handl-verify: every peregrin-bundle declares
  # provider.name: peregrin so all campaign services render ONE
  # peregrin-campaign.service. Keep `exec` identical — last deploy
  # wins the unit file.
  name: peregrin
  services:
    - name: campaign
      exec: >-
        ~/.local/bin/peregrin campaign serve ~/.config/peregrin/serve
        --listen 127.0.0.1:29173 --path /hook
        --history-dir ~/.local/share/peregrin/serve-history
        --queue-store-dir ~/.local/share/peregrin/serve-queues
      env_file: "~/.config/peregrin/env"
      workdir: "~"
      restart: on-failure
  # No ingress: schedule + `campaign run`/`submit` only — nothing
  # listens for forge webhooks.
  verbs: [run, logs]
