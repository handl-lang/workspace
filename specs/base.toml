# handl/base — the floor every handl-lang/* repo must meet.
#
# severity=warn on purpose: this is the ratchet floor. Missing
# AGENTS/README/LICENSE/bupha surfaces as warnings fleet-wide
# until each family flips to fail.
#
# `files` exact entries are REQUIRED (missing → violation).
# `cover`/`cover_dirs` whitelist tracked files for the unlisted
# check — coverage only, never required. `unlisted` runs against
# the UNION of all matched specs, so family specs contribute their
# own trees; base only needs the shared floor plus plausible
# catch-alls.

family   = "handl/base"
match    = []                # every repo
severity = "warn"

files = [
  "README.md",
  "LICENSE",
  "AGENTS.md",
  "bupha.toml",
  "workflows/gate.yaml",   # the vendored handl-gates bundle — near-universal
]

cover = [
  # root-level artifacts — `*` crosses '/', so these also cover
  # nested matches; dirs[] carries the tree whitelist.
  "*.toml", "*.json", "*.jsonl", "*.yaml", "*.yml", "*.lock", "*.md",
  "*.txt", "*.css", "*.ts", "*.tsx", "*.js", "*.py",
  "*.png", "*.svg", "*.onnx", "*.safetensors", "*.hnl",
  "Makefile", "NOTICE", "LICENSE*", "CNAME",
  "build.rs",                  # rust build script — legit root file
  "*.sh",                      # ci.sh / gate.sh / hnl-gate.sh — sanctioned
                              # gate-entry names (audit: ci.sh is the
                              # documented gate entry alongside gate.yaml)
  # universal dotfile/config artifacts — `*` crosses '/', so these
  # cover nested matches too (api/.env.example, app/.gitignore, …)
  "*.env.example", ".env.example", "VERSION", "*.gitkeep",
  "*.gitignore", "*.mjs", "*.vue", "*.lockb", "*.code-workspace",
  "*.nuxtrc", "*.python-version", "*.tmpl", "*.template",
  "*.lua", "*.pdf", "*.cast", "Dockerfile",
  # polyglot bench/task sources — the bench/tasks repos compare
  # languages; these extensions are content, not strays
  "*.go", "*.java", "*.rb", "*.jl", "*.erl", "*.cs", "*.csproj",
  "*.c", "*.h",
  # tracked dotfiles every repo carries — enumerated, never `.*`
  # (a blanket dot-glob would whitelist committed .env secrets)
  ".gitignore", ".gitattributes", ".gitmodules", ".editorconfig",
  ".nojekyll", ".mailmap", ".vscodeignore",
]

cover_dirs = [
  ".agents", ".cargo", ".claude", ".config", ".cursor", ".devin",
  ".github", ".githooks", ".hooks", ".handl", ".idea", ".kuda",
  ".vscode", ".vitepress",
  "adrs", "bench", "benches", "ci", "components", "contact", "crates",
  "data", "dist", "docs", "ecosystem", "engines", "examples",
  "fuzz", "handl-packages", "libraries", "members", "modules",
  "packages", "paper", "paradigm", "project", "public", "research",
  "rules", "scripts", "specs", "src", "story", "strategy", "tasks",
  "templates", "tests", "vendor", "workflows", "xtask",
  "hnl-ext-tensor",   # lib-tensor-native: the tensor.* PyO3 extension crate dir
]

# --- providers ---
# `repo` provider: bupha.toml [[repos]] name must end in /<dirname>
# — catches name=/dir= drift after renames. Warn floor.
[providers.repo]
bupha-name = true
severity   = "warn"

# --- predicates (mimus-spec phase 2) ---
[path."LICENSE"]
contains = "MIT"        # org license is MIT; Apache-2.0 mentions drift

# bupha runner must be the gate.yaml peregrin campaign — ci.sh is
# retired fleet-wide; a `bash ci.sh`/`bash scripts/ci.sh` cmd is the
# stale-runner drift this catches. Known false positive: docs/'s
# bupha.toml is a deploy-watch manifest, not a gate runner. Fix
# landed in mimus-spec (`except` repo-name globs on path tables) —
# adopt `except = ["docs"]` here once a mimus release ships it;
# older binaries hard-error on the unknown key and disable the leg.
[path."bupha.toml"]
regex = 'peregrin campaign'

# AGENTS.md must carry real guide sections, not just the myco
# agent-awareness boilerplate. Rust regex: no lookahead, so this
# enumerates the section names the fleet actually uses.
[path."AGENTS.md"]
regex = '(?m)^## (Layout|Contract|Conventions|Verification|Build|Usage|Development|Overview|Architecture|Commands|Testing)'
