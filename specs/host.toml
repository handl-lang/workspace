# handl/host — host, host-* distribution repos (binaries, servers).
# host-tensor → exec-tensor → lib-tensor-native (atom provider,
# handl/lib family via `lib-*`) — no host-* member pending.

extends = "base.toml"

family   = "handl/host"
match    = ["host", "host-*"]
severity = "warn"

files = [
  "Cargo.toml",
]

cover_dirs = [
  "dagger", "modules", "skills",   # host pipeline + agent-skill trees
]
