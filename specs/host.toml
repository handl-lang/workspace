# handl/host — host, host-* distribution repos (binaries, servers).
# host-tensor was renamed exec-tensor and reclassified into
# handl/engine (matches `exec-*`) — no host-* member pending.

extends = "base.toml"

family   = "handl/host"
match    = ["host", "host-*"]
severity = "warn"

files = [
  "Cargo.toml",
]

cover_dirs = [
  "dagger", "modules", "skills",   # host pipeline + agent-skill trees
]
