# handl/engine — the operation layer per templates/README: engine,
# engine-*, exec*, tool-* (incl. tool-compile-*/tool-codegen-*
# sub-families), ext-* (Handl language extensions — Rust cdylib +
# xtask). All 35 member repos uniformly carry Cargo.toml +
# xtask/Cargo.toml + workflows/gate.yaml (verified 2026-11-24).

extends = "base.toml"

family   = "handl/engine"
match    = ["engine", "engine-*", "exec", "exec-*", "tool-*", "ext-*"]
severity = "fail"

files = [
  "Cargo.toml",
  "xtask/Cargo.toml",
]

cover_dirs = [
  "laws",   # engine-eqsat law files
]

# Rust floor: every engine-family manifest declares its MSRV
# (fleet standard rust-version = "1.85", edition 2024).
[path."Cargo.toml"]
regex = '(?m)^rust-version'

# [patch.*] sources must stay org-local — enforced semantically by
# the `cargo` provider (regex can't express "github.com/handl-lang
# only"); the sanctioned sibling-dev-link convention
# (`[patch."https://github.com/handl-lang/…"]` + `path = "../…"`)
# is allowed, external sources are not.
[providers.cargo]
patches = "org-only"
