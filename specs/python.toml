# handl/python — uv/python repos (eqsat, gamekit, discoverykit,
# research-*, kernelopt) PLUS the kit-python cohort — the mlopt-*
# repos were renamed back to kit-* (kit-{torch,discovery,carriers,
# product,pipeline}, joining kit-{cuda,host-tensor}; all verified
# pyproject+uv.lock, no Cargo.toml). kit-pkg is the only Rust kit
# and stays kit-only; kit-kernel-ir was deleted (empty meta-package
# over lib-kernel-ir + lib-triton-qgemv). The kit-python names are
# listed explicitly because `kit-*` would wrongly pull in kit-pkg;
# when the cohort relocates out of `kit-*` (templates/README pending
# decision) update this list.

extends = "base.toml"

family   = "handl/python"
match    = ["eqsat", "gamekit", "discoverykit",
            "research-*", "kernelopt",
            "kit-cuda", "kit-host-tensor", "kit-torch",
            "kit-discovery", "kit-carriers", "kit-product",
            "kit-pipeline"]
severity = "fail"

files = [
  "pyproject.toml",
  "uv.lock",
]

[path."pyproject.toml"]
contains = "requires-python"        # every uv repo pins its python
regex    = '(?m)^name = "'         # [project] name present
