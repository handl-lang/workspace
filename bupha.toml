# bupha.toml — committed CI manifest for handl-lang/workspace.
#
# The gate is the peregrin campaign in workflows/gate.yaml (ported from
# the retired handl-lang/automation repo — its ci.sh was already gone, so
# the old manifest's `bash ci.sh` runner was stale). The runner executes
# the campaign in the pushed worktree and checks .ci-result.json's
# conclusion, same contract the fleet's gate.yaml files document.
#
# Merge the [[repos]] entry into the shared watcher
# (~/.config/bupha/bupha.toml) or run: bupha watch --config bupha.toml

[[repos]]
name = "handl-lang/workspace"
dir = "~//GitHub/handl-lang/workspace"
branch = "refs/heads/main"
  [repos.runner]
  kind = "script"
  cmd = "export PATH=\"$HOME/.local/bin:$PATH\"; GATE_REPO=\"$PWD\" GATE_RESULTS=\"$PWD/.gate-results.jsonl\" peregrin campaign run workflows/gate.yaml --result .ci-result.json && jq -e '.conclusion == \"success\"' .ci-result.json"
  cancel_running = true

[status]
kind = "github"
context = "ci/bupha"
